# Development Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (Development - Local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/building_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration (Development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging Configuration (Development - Verbose)
logging.level.root=INFO
logging.level.com.srtraders24=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.data=DEBUG

# Error Handling (Development)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# Actuator Configuration (Development - All endpoints exposed)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# JWT Configuration (Development)
jwt.secret.key=dev-secret-key-change-in-production
jwt.expiration.time=86400000

# Swagger Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Cache Configuration (Development - Disable caching)
spring.cache.type=none

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB